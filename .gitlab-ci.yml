stages:
  - build
  - migration
  - deploy

include:
  - project: 'devops/templates'
    ref: 'ec2'
    file:
      - 'arm-build-ci.yml'
      - 'arm-migration-ci.yml'
      - 'arm-deploy-ci.yml'

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "$CI_PROJECT_NAME-dev"
      when: always
    - if: '$CI_COMMIT_BRANCH  == "master"'
      variables:
        DOCKER_REPOSITORY: "$CI_PROJECT_NAME"
    - when: never

dev:migration:
  stage: migration
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "$CI_PROJECT_NAME-dev"
      when: always
    - when: never

dev:deploy:
  stage: deploy
  needs:
    - dev:migration
  only:
    - dev

prod:migration:
  stage: migration
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "master"'
      variables:
        DOCKER_REPOSITORY: "$CI_PROJECT_NAME"
      when: always
    - when: never

prod:deploy:
  stage: deploy
  when: manual
  needs:
    - prod:migration
  only:
    - master
