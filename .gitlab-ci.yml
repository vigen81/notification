variables:
  HELM_PATH: helm-live/base/apps/golang-notification/api

stages:
  - build
  - migration
  - deploy

include:
  - project: 'devops/templates'
    ref: 'main'
    file:
      - 'arm-build-ci.yml'
      - 'arm-migration-ci.yml'
      - 'arm-deploy-ci.yml'

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "golang-notification-dev"
      when: always
    - when: never

dev:migration:
  stage: migration
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "golang-notification-dev"
      when: always
    - when: never

dev:deploy:
  stage: deploy
  needs:
    - dev:migration
  only:
    - notification-engine

