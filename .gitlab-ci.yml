deploy-dev:
  stage: deploy-dev
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl bash
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
    - mv kustomize /usr/local/bin/
    - echo ${CI_USERNAME}
    - echo ${CI_PUSH_TOKEN}
    - mdkir -p /code/data
    - cd /code/data
    - git clone https://${CI_USERNAME}:${CI_PUSH_TOKEN}@gitlab.com/healthcare-integration/gitops.git ./
    - git config --global user.email "gitlab@gitlab.com"
    - git config --global user.name "GitLab CI/CD"
    - git config pull.rebase true
    - git config advice.mergeConflict false
  script:
    - git checkout -B master
    - git pull origin master
    - cd dev/notification-service
    - kustomize edit set image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - cat kustomization.yaml
    - git commit -am '[skip ci] DEV image update'
    - git push origin master
  only:
    - master
    - dev