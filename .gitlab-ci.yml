variables:
  HELM_PATH: helm/base/apps/notification-service/api

stages:
  - build
  - migration
  - deploy

include:
  - project: 'devops/templates'
    ref: 'ec2'
    file:
      - 'arm-build-ci.yml'
      - 'arm-migration-ci.yml'
      - 'arm-deploy-ci.yml'

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "golang-notification-dev"
      when: always
    - if: '$CI_COMMIT_BRANCH  == "main"'
      variables:
        DOCKER_REPOSITORY: "golang-notification"
      when: always
    - when: never

dev:migration:
  stage: migration
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "notification-engine"'
      variables:
        DOCKER_REPOSITORY: "golang-notification-dev"
      when: always
    - when: never

dev:deploy:
  stage: deploy
  needs:
    - dev:migration
  only:
    - notification-engine

prod:migration:
  stage: migration
  when: manual
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH  == "main"'
      variables:
        DOCKER_REPOSITORY: "golang-notification"
      when: always
    - when: never

prod:deploy:
  stage: deploy
  when: manual
  needs:
    - prod:migration
  only:
    - main
